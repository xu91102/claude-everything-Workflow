name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install runtime dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify harness
        run: npm run verify

      - name: Test Skill manifest validator
        run: npm run test:manifest

      - name: Test host invocation policies
        run: npm run test:invocation

      - name: Test continuation and authorization contracts
        run: npm run test:continuation

      - name: Test rule installation and migration
        run: npm run test:install-rules

      - name: Test plugin distribution
        run: npm run test:plugins

      - name: Validate npm package
        run: npm run pack:dry-run

      - name: Verify production package CLI
        run: |
          package_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir"
          npm install --prefix "$package_dir" --omit=dev --ignore-scripts --no-audit --no-fund --package-lock=false "$package_dir/"*.tgz
          node "$package_dir/node_modules/claude-everything-workflow/bin/claude-everything-workflow.js" verify

  test-macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test installer with macOS system Bash
        env:
          CEW_TEST_BASH: /bin/bash
        run: |
          /bin/bash --version
          npm run test:install-rules

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, test-macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish package and create release tag
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/publish-release.js
