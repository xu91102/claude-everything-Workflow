name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip npm]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify harness
        run: npm run verify

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          REGISTRY_VERSION="$(npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          BASE_VERSION="${REGISTRY_VERSION:-$LOCAL_VERSION}"
          VERSION="$(node - "$BASE_VERSION" "$BUMP_TYPE" <<'NODE'
          const [baseVersion, bumpType] = process.argv.slice(2);
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-.+)?$/.exec(baseVersion);
          if (!match) {
            throw new Error(`Unsupported semver version: ${baseVersion}`);
          }
          let [, major, minor, patch] = match.map(Number);
          if (bumpType === "major") {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (bumpType === "minor") {
            minor += 1;
            patch = 0;
          } else if (bumpType === "patch") {
            patch += 1;
          } else {
            throw new Error(`Unsupported bump type: ${bumpType}`);
          }
          console.log(`${major}.${minor}.${patch}`);
          NODE
          )"
          echo "Base version: $BASE_VERSION"
          echo "Next version: $VERSION"
          npm version "$VERSION" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package
        run: npm run pack:dry-run

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip npm]"
          git tag "v${{ steps.version.outputs.version }}"

      - name: Publish to npm
        run: npm publish

      - name: Push version commit and tag
        run: git push --follow-tags origin HEAD:main
